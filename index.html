<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bio / sh4rpy</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Raleway', sans-serif;
            font-weight: 400;
            color: #eee;
            background-color: #101010;
            min-height: 100vh;
            /* Теперь можно скроллить */
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Градиентная полоска фиксирована сверху */
        .divide {
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, #1e5799 0%, #f300ff 50%, #e0ff00 100%);
            border-bottom: 1px solid #000;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Canvas для эффектов — фиксирован на весь экран */
        #effect-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Контент прокручивается поверх фона */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px; /* добавил отступ снизу для комфорта */
            text-align: center;
            position: relative;
            z-index: 5;
            min-height: 100vh; /* чтобы контент всегда занимал хотя бы экран */
        }

        .logo {
            font-size: 52pt;
            font-weight: 900;
            color: #eee;
            margin-bottom: 5px;
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
        }

        .logo span {
            color: #00BFFF;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .subtitle {
            font-size: 14pt;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #3a3a3a;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .avatar-img:hover {
            border-color: #00BFFF;
            transform: scale(1.05);
        }

        .name {
            font-size: 28pt;
            font-weight: 900;
            color: #fff;
            margin-bottom: 5px;
        }

        .tag {
            color: #00BFFF;
            font-size: 12pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .bio-text {
            color: #aaa;
            font-size: 12pt;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        .audio-player {
            margin: 20px auto;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 20px 25px;
            max-width: 400px;
            position: relative;
            z-index: 5;
        }

        .track-info {
            text-align: center;
            margin-bottom: 12px;
        }

        .track-title {
            font-weight: 700;
            font-size: 14pt;
            color: #eee;
            display: block;
            margin-bottom: 2px;
        }

        .track-artist {
            font-size: 10pt;
            color: #888;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: #2a2a2a;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #00BFFF;
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            font-size: 10pt;
            color: #888;
            font-family: 'Courier New', monospace;
            min-width: 40px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #eee;
            font-size: 20pt;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Raleway', sans-serif;
        }

        .control-btn:hover {
            transform: scale(1.1);
            color: #00BFFF;
        }

        .control-btn.play-btn {
            font-size: 28pt;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-slider {
            width: 60px;
            height: 4px;
            background: #2a2a2a;
            border-radius: 4px;
            cursor: pointer;
            appearance: none;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00BFFF;
            cursor: pointer;
        }

        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #eee;
            text-decoration: none;
            font-weight: 600;
            font-size: 11pt;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #00BFFF;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.15);
        }

        .social-btn i {
            font-size: 14pt;
        }

        .clock {
            color: #666;
            font-size: 10pt;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
        }

        .typing-container {
            margin-bottom: 25px;
            min-height: 40px;
        }

        .typing-text {
            font-size: 18pt;
            font-weight: 900;
            color: #00BFFF;
            display: inline-block;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            background-color: #00BFFF;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .easter-egg {
            display: none;
            margin-top: 20px;
            color: #00BFFF;
            font-size: 14pt;
            font-weight: 900;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px #00BFFF; }
            to { text-shadow: 0 0 20px #00BFFF, 0 0 30px #00BFFF; }
        }

        .easter-egg-2 {
            display: none;
            margin-top: 10px;
            color: #ff6b6b;
            font-size: 12pt;
            font-weight: 400;
            font-family: 'Courier New', monospace;
        }

        .footer {
            text-align: center;
            padding: 30px 0;
            color: #666;
            font-size: 10pt;
            position: relative;
            z-index: 5;
        }

        @media (max-width: 500px) {
            .logo { font-size: 36pt; }
            .name { font-size: 22pt; }
            .social-btn { padding: 8px 14px; font-size: 10pt; }
        }
    </style>
</head>
<body>

    <div class="divide"></div>

    <canvas id="effect-canvas"></canvas>

    <div class="container">
        
        <div class="logo" onclick="switchEffect()">sh4r<span>py</span></div>
        <div class="subtitle">/ bio</div>

        <div class="avatar-wrapper">
            <img src="img/avatar.jpg" alt="sh4rpy" class="avatar-img">
        </div>

        <div class="name">sh4rpy</div>
        <div class="tag">✦ разработчик / энтузиаст</div>

        <div class="typing-container">
            <span class="typing-text" id="typing-text"></span>
            <span class="cursor"></span>
        </div>

        <div class="bio-text">
            sh4rpy · разработчик · энтузиаст
        </div>

        <div class="audio-player">
            <div class="track-info">
                <span class="track-title" id="trackTitle">атмосфера</span>
                <span class="track-artist">sh4rpy</span>
            </div>

            <div class="progress-container">
                <span class="time-display" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time-display" id="totalTime">0:00</span>
            </div>

            <div class="controls">
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="control-btn play-btn" id="playBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏭</button>
                <div class="volume-container">
                    <span style="color:#888;font-size:14pt;">🔊</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.7">
                </div>
            </div>
        </div>

        <audio id="audioPlayer" src="music/track.mp3" preload="metadata"></audio>

        <div class="social-links">
            <a href="https://github.com/sh4rpy-cc" target="_blank" class="social-btn">
                <span style="font-weight: 900;"></span> GitHub
            </a>
            <a href="https://t.me/adapterryta" target="_blank" class="social-btn">
                <span style="font-weight: 900;">✈</span> Telegram
            </a>
            <a href="mailto:nirkolovdifzii@gmail.com" class="social-btn">
                <span style="font-weight: 900;">✉</span> Email
            </a>
        </div>

        <div class="clock" id="clock">--:--:--</div>

        <div class="easter-egg" id="easter-egg">🔮 ТЫ НАШЁЛ ПАСХАЛКУ! СЛАВА ШАРПИ!</div>
        <div class="easter-egg-2" id="easter-egg-2"></div>

    </div>

    <div class="footer">
        &copy; 2026 · sh4rpy
    </div>

    <script src="https://unpkg.com/scrollreveal"></script>
    <script>
        // Анимации появления
        ScrollReveal().reveal('.logo', { delay: 200, duration: 800, distance: '30px', origin: 'top' });
        ScrollReveal().reveal('.avatar-wrapper', { delay: 400, duration: 800, distance: '30px', origin: 'bottom' });
        ScrollReveal().reveal('.name', { delay: 600, duration: 800, distance: '30px', origin: 'left' });
        ScrollReveal().reveal('.bio-text', { delay: 800, duration: 800, distance: '30px', origin: 'right' });
        ScrollReveal().reveal('.audio-player', { delay: 1000, duration: 800, distance: '30px', origin: 'bottom' });
        ScrollReveal().reveal('.social-links', { delay: 1200, duration: 800, distance: '30px', origin: 'bottom' });
        ScrollReveal().reveal('.clock', { delay: 1400, duration: 800, distance: '30px', origin: 'bottom' });

        // Часы
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== Печатающийся текст =====
        const phrases = [
            "✦ код — это поэзия",
            "✦ реальность — это всего лишь ещё одна программа",
            "✦ ты — главный герой своей истории",
            "✦ ничего не истинно, всё разрешено",
            "✦ будущее уже написано... ты просто его читаешь",
            "✦ тишина — тоже код",
            "✦ sh4rpy в сети",
            "✦ система стабильна",
            "✦ соединение установлено",
            "✦ режим полёта: активирован",
            "✦ shadow mode: on",
            "✦ я здесь, чтобы создавать",
            "✦ skeet загружен успешно",
            "✦ скучаю по 2018",
            "✦ вруби музыку, это поможет",
            "✦ ещё один день, ещё один коммит",
            "✦ 999+ строк кода за сегодня",
            "✦ кофе > компилятор",
            "✦ кто читает этот текст — ты в матрице",
            "✦ агенты уже близко",
            "✦ следующая пасхалка скрыта в коде",
            "✦ 42",
            "✦ не ищи истину, создавай её",
            "✦ все системы работают, sh4rpy",
        ];

        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typingElement = document.getElementById('typing-text');

        function typeEffect() {
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                typingElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typingElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 40 : 80;
            let pauseAfterComplete = 7000;

            if (!isDeleting && charIndex === currentPhrase.length) {
                typeSpeed = pauseAfterComplete;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                typeSpeed = 800;
            }

            setTimeout(typeEffect, typeSpeed);
        }

        typeEffect();

        // ===== Кастомный плеер =====
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeDisplay = document.getElementById('currentTime');
        const totalTimeDisplay = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const trackTitle = document.getElementById('trackTitle');

        const playlist = [
            { src: 'music/track.mp3', title: 'Silence', artist: 'Sneaky' }
        ];
        let currentTrack = 0;

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            trackTitle.textContent = track.title;
            audio.load();
            if (!audio.paused) {
                audio.play();
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        }

        function updateProgress() {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeDisplay.textContent = formatTime(audio.currentTime);
            totalTimeDisplay.textContent = formatTime(audio.duration);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function setProgress(e) {
            const rect = progressBar.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = (x / rect.width) * 100;
            audio.currentTime = (percent / 100) * audio.duration;
        }

        playBtn.addEventListener('click', togglePlay);
        progressBar.addEventListener('click', setProgress);
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', () => {
            playBtn.textContent = '▶';
        });

        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value;
        });

        prevBtn.addEventListener('click', () => {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack);
            if (audio.paused) playBtn.textContent = '▶';
            else playBtn.textContent = '⏸';
        });

        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadTrack(currentTrack);
            if (audio.paused) playBtn.textContent = '▶';
            else playBtn.textContent = '⏸';
        });

        loadTrack(0);
        updateProgress();

        // ===== Переключатель эффектов =====
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        let currentEffect = 0;
        let animationId = null;
        const effects = ['rain', 'snow', 'sparks', 'fog'];
        const effectNames = ['🌧️ Дождь', '❄️ Снег', '✨ Искры', '💨 Туман'];

        let particles = [];

        // Инициализация частиц для выбранного эффекта
        function initEffect(effect) {
            particles = [];
            const num = 150;
            for (let i = 0; i < num; i++) {
                if (effect === 'rain') {
                    particles.push({
                        type: 'rain',
                        x: Math.random() * width,
                        y: Math.random() * height,
                        speed: 4 + Math.random() * 6,
                        length: 10 + Math.random() * 15,
                        opacity: 0.3 + Math.random() * 0.4
                    });
                } else if (effect === 'snow') {
                    particles.push({
                        type: 'snow',
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: 2 + Math.random() * 4,
                        speed: 1 + Math.random() * 2,
                        wobble: 0.5 + Math.random() * 1.5
                    });
                } else if (effect === 'sparks') {
                    const angle = Math.random() * Math.PI * 2;
                    const vel = 1 + Math.random() * 3;
                    particles.push({
                        type: 'sparks',
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: Math.cos(angle) * vel,
                        vy: Math.sin(angle) * vel,
                        radius: 1 + Math.random() * 3,
                        life: 0.5 + Math.random() * 1.5
                    });
                } else if (effect === 'fog') {
                    particles.push({
                        type: 'fog',
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: 100 + Math.random() * 200,
                        speed: 0.3 + Math.random() * 0.5
                    });
                }
            }
        }

        // Обновление и отрисовка кадра
        function updateEffect(effect) {
            ctx.clearRect(0, 0, width, height);
            
            if (effect === 'rain') {
                ctx.strokeStyle = 'rgba(200, 200, 255, 0.6)';
                ctx.lineWidth = 1;
                for (let p of particles) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - 2, p.y + p.length);
                    ctx.stroke();
                    p.y += p.speed;
                    if (p.y > height) {
                        p.y = -20;
                        p.x = Math.random() * width;
                    }
                }
            } else if (effect === 'snow') {
                for (let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fill();
                    p.y += p.speed;
                    p.x += Math.sin(p.y * 0.02) * p.wobble;
                    if (p.y > height) {
                        p.y = -10;
                        p.x = Math.random() * width;
                    }
                }
            } else if (effect === 'sparks') {
                for (let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 200, 100, ${p.life / 2})`;
                    ctx.fill();
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.99;
                    p.vy *= 0.99;
                    p.life -= 0.01;
                    if (p.life <= 0 || p.x < 0 || p.x > width || p.y < 0 || p.y > height) {
                        const angle = Math.random() * Math.PI * 2;
                        const vel = 1 + Math.random() * 3;
                        p.x = Math.random() * width;
                        p.y = Math.random() * height;
                        p.vx = Math.cos(angle) * vel;
                        p.vy = Math.sin(angle) * vel;
                        p.life = 0.5 + Math.random() * 1.5;
                    }
                }
            } else if (effect === 'fog') {
                for (let p of particles) {
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
                    grad.addColorStop(0, 'rgba(200, 200, 255, 0.15)');
                    grad.addColorStop(1, 'rgba(200, 200, 255, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    p.x += p.speed;
                    if (p.x > width) p.x = -p.radius;
                }
            }
        }

        // Главный цикл анимации
        function animate() {
            updateEffect(effects[currentEffect]);
            animationId = requestAnimationFrame(animate);
        }

        // Переключение эффекта
        function switchEffect() {
            // Останавливаем старую анимацию
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            currentEffect = (currentEffect + 1) % effects.length;
            initEffect(effects[currentEffect]);
            
            // Показываем название эффекта на 3 секунды
            const egg = document.getElementById('easter-egg');
            egg.textContent = `✨ ${effectNames[currentEffect]}`;
            egg.style.display = 'block';
            setTimeout(() => {
                egg.style.display = 'none';
                egg.textContent = '🔮 ТЫ НАШЁЛ ПАСХАЛКУ! СЛАВА ШАРПИ!';
            }, 3000);
            
            // Запускаем новую анимацию
            animate();
        }

        // Инициализация при загрузке
        initEffect('rain');
        animate();

        // Обработка ресайза
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Перезапускаем эффект с новыми размерами
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            initEffect(effects[currentEffect]);
            animate();
        });

        // Тройной клик по аватарке
        let avatarClicks = 0;
        document.querySelector('.avatar-img').addEventListener('click', function() {
            avatarClicks++;
            if (avatarClicks === 3) {
                const egg2 = document.getElementById('easter-egg-2');
                egg2.textContent = "✦ DEEP WEB DETECTED. YOU ARE NOW SHADOW.";
                egg2.style.display = 'block';
                setTimeout(() => {
                    egg2.style.display = 'none';
                    avatarClicks = 0;
                }, 4000);
            }
